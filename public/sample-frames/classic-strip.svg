<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800">
  <!-- Classic 4-cut strip · 2x6" at 300 DPI · 4 landscape photos. Photo holes are transparent. -->
  <defs>
    <mask id="holes">
      <rect width="600" height="1800" fill="white"/>
      <rect x="36" y="36"   width="528" height="371" rx="6" fill="black"/>
      <rect x="36" y="427"  width="528" height="371" rx="6" fill="black"/>
      <rect x="36" y="818"  width="528" height="371" rx="6" fill="black"/>
      <rect x="36" y="1209" width="528" height="371" rx="6" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#holes)">
    <rect width="600" height="1800" fill="#f6f1e7"/>
    <rect x="12" y="12" width="576" height="1776" rx="4" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  </g>
  <line x1="200" y1="1622" x2="400" y2="1622" stroke="#1c1c1c" stroke-width="1.5"/>
  <text x="300" y="1696" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="68" fill="#1c1c1c">flipbook</text>
  <text x="300" y="1744" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="7" fill="#1c1c1c" opacity="0.65">SELF PHOTO STUDIO</text>
</svg>
